[project]
name = "wdm_cnn"
version = "0.1.0"
description = "CNN-based classification of dark matter models from mock galaxy imaging"
requires-python = ">=3.10"
dependencies = ["healpy", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wdm_cnn"]
